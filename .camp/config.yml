# How camp's own working directory is composed.
#
# The product, the development environment and the design record are three
# separate repositories, and this file is the only place that knows about
# all three.

env: /home/dlaszlo/dev/camp-env
merged: camp-live

repositories:
  - { name: workspace, path: camp-workspace }
  - { name: code,      path: camp }
  - { name: notes,     path: camp-notes }

overlayfs:
  # Read-only underneath: what a session needs to see and must not write.
  lower: [workspace]
  # On top, and the only place ordinary writes land: the product.
  upper: code

# Each repository needs its own .gitignore, and it is a file overlap, so
# the composed tree shows the code repository's copy -- which is correct,
# because the live tree is governed by the product's ignore rules.
allow_overlap: [.gitignore]

steps:
  - mount_rw:
      # Both repositories have a .git at their root and directories merge,
      # so without this bind the two histories would union. camp never adds
      # it on its own; leaving it out is caught by the overlap gate.
      - { source: "code/.git", target: ".git" }

      # The design record: its own repository, writable from inside,
      # because it is written while the work happens. It cannot live in the
      # workspace, which is read-only in there on purpose.
      - { source: "notes",     target: ".notes" }

  # Half repository, half machine state: what the workspace tracks stands
  # read-only, and settings.local.json and the worktrees land in
  # machine-local storage underneath.
  - mount_islands:
      - { source: "workspace/.claude", target: ".claude" }

  # Reads git, produces the exclude and the islands expansions, and binds
  # the exclude over the composed tree's copy. After the .git bind, because
  # its target lies inside it.
  - git_exclude

# What configures the session 'camp run' and 'camp shell' start. Nothing
# here touches the tree, which is why it sits in its own section: 'camp up'
# starts no session, so it applies none of this and prints one line saying
# so.
session:
  # A session maps only this uid, so every file owned by anyone else reads
  # back as 'nobody' -- and ssh refuses a system-wide configuration file it
  # can attribute to neither root nor you. These three lines are how this
  # composition adapts to that, and the whole arrangement is described in
  # the product's docs/install.md, under "ssh inside a session".
  environment:
    # git starts ssh itself, so one variable covers it -- including where
    # no shell is involved at all, which is the case for anything 'camp
    # run' starts directly. -F names the file to read and, in doing so,
    # makes ssh skip the system-wide one.
    GIT_SSH_COMMAND: "ssh -F ${HOME}/.ssh/config"

    # ssh, scp and sftp typed by hand have no such variable, so the only
    # control left is which program the name resolves to. This puts a
    # directory the workspace repository owns first on the session's path;
    # the launchers that go in it are ordinary workspace content, written
    # and reviewed here rather than generated by camp.
    PATH: "$CAMP_LIVE/.workspace/bin:$PATH"

    # The path as it was outside, under a name this composition chose. The
    # launchers read it to find the real programs, so that none of them has
    # to name a directory a distribution happens to use.
    OUTER_PATH: "$PATH"
